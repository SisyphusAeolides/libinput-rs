name: Remove merged branches

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove non-main branches
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = os.environ.get("GITHUB_HEAD_REF", "")

          def request(url: str, method: str = "GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          branches = []
          page = 1
          while True:
              batch = request(f"{api}/repos/{repo}/branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(item["name"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          targets = [branch for branch in branches if branch != "main"]
          targets.sort(key=lambda branch: branch == current)

          print("Branches before cleanup:")
          for branch in branches:
              print(f"  {branch}")

          for branch in targets:
              encoded = urllib.parse.quote(branch, safe="/")
              request(f"{api}/repos/{repo}/git/refs/heads/{encoded}", method="DELETE")
              print(f"Deleted {branch}")

          remaining = request(f"{api}/repos/{repo}/branches?per_page=100")
          names = [item["name"] for item in remaining]
          print("Branches after cleanup:")
          for branch in names:
              print(f"  {branch}")

          if names != ["main"]:
              raise SystemExit(f"unexpected remaining branches: {names}")
          PY
