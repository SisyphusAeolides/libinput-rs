name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.75
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: clippy

      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace

      - name: Lint with minimum supported Rust version
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test with minimum supported Rust version
        run: cargo test --locked --workspace

  rust-rpm:
    name: Rust and RPM
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DNF dependencies
        run: >-
          dnf -y -q install cpio curl elfutils gcc gcc-gfortran libevdev-devel
          libwacom-devel make meson mtdev-devel ninja-build pkgconf-pkg-config
          python3 python3-libevdev python3-pyudev python3-pyyaml ripgrep rust cargo
          clippy rustfmt binutils rpm-build rpmdevtools systemd-devel systemd-rpm-macros

      - name: Check packaging inputs
        run: make packaging-check

      - name: Check Rust workspace
        run: cargo check --locked --workspace

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test portable libinput implementation
        run: cargo test --locked --package libinput-rs

      - name: Test Fedora libwacom integration
        run: cargo test --locked --package libinput-rs --features libwacom

      - name: Build portable shared library
        run: |
          make shared
          ! readelf -d target/release/libinput.so | grep -q 'libwacom\.so'

      - name: Build Fedora shared library
        run: |
          CARGO_FEATURES='--features libwacom' make shared
          readelf -d target/release/libinput.so | grep -q 'libwacom\.so'

      - name: Compare ABI against system libinput when available
        run: |
          if test -r /usr/lib64/libinput.so.10; then
            make abi-check REFERENCE_LIBINPUT=/usr/lib64/libinput.so.10
          else
            echo "System libinput reference is unavailable; skipping ABI comparison."
          fi

      - name: Check package metadata
        run: cargo metadata --locked --offline --no-deps >/dev/null

      - name: Check single-crate publication manifest
        run: make crate-package-check main-crate-package-check

      - name: Verify ABI isolation
        run: |
          test "$(readelf -d target/release/libinput.so | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')" = "libinput.so.10"
          objdump -T target/release/libinput.so | grep -q 'LIBINPUT_0.12.0.*libinput_get_fd'
          test -z "$(nm -D target/release/libinput.so | grep -E ' T (rust_|__rd)' || true)"

      - name: Build source RPM
        run: |
          rpm_topdir="$RUNNER_TEMP/libinput-rs-rpmbuild"
          mkdir -p "$rpm_topdir/SOURCES" "$rpm_topdir/SRPMS" "$rpm_topdir/RPMS"
          echo "RPM_TOPDIR=$rpm_topdir" >> "$GITHUB_ENV"
          make srpm RPM_TOPDIR="$rpm_topdir"

      - name: Rebuild binary RPMs
        run: rpmbuild --rebuild "$RPM_TOPDIR"/SRPMS/*.src.rpm --define "_topdir $RPM_TOPDIR"

      - name: Locate binary RPMs
        run: |
          runtime=$(find "$RPM_TOPDIR/RPMS" -name 'libinput-rs-[0-9]*.rpm' -print -quit)
          test -n "$runtime"
          echo "RPM_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Inspect RPM metadata
        run: |
          rpm -qpl "$RPM_RUNTIME"
          rpm -qp --provides "$RPM_RUNTIME"
          rpm -qp --obsoletes "$RPM_RUNTIME"

      - name: Upload binary RPMs
        uses: actions/upload-artifact@v4
        with:
          name: libinput-rs-rpms
          path: ${{ env.RPM_RUNTIME }}

      - name: Verify RPM payloads
        run: make rpm-package-check RPM_RUNTIME="$RPM_RUNTIME"

  upstream-behavior:
    name: Upstream behavioral parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install native and test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential gfortran git meson ninja-build patch rsync
          check libevdev-dev libmtdev-dev libudev-dev libwacom-dev
          python3-libevdev python3-pytest python3-yaml

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Run keyboard and ownership regressions
        run: |
          cargo test --locked keyboard_chords_keep_independent_per_code_state
          cargo test --locked duplicate_keyboards_count_the_same_key_per_device
          cargo test --locked simultaneous_mouse_buttons_are_independent
          cargo test --locked mixed_nodes_keep_keyboard_and_button_ranges_separate
          cargo test --locked upstream_speed_curves_preserve_default_and_nonzero_minimum
          cargo test --locked tap_button_map_changes_two_and_three_finger_buttons
          cargo test --locked queued_events_retain_devices_until_event_destroy

      - name: Build replacement library
        run: make shared

      - name: Check out pinned upstream test corpus
        run: |
          git init "$RUNNER_TEMP/libinput-upstream"
          git -C "$RUNNER_TEMP/libinput-upstream" remote add origin https://gitlab.freedesktop.org/libinput/libinput.git
          git -C "$RUNNER_TEMP/libinput-upstream" fetch --depth=1 origin 26191d396d74d505541d6311f0b4ae68d791b890
          git -C "$RUNNER_TEMP/libinput-upstream" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/libinput-upstream-build" "$RUNNER_TEMP/libinput-upstream" \
            -Dtests=true -Ddocumentation=false -Ddebug-gui=false -Dlibwacom=false

      - name: Gate pinned upstream quirk semantics
        env:
          LIBINPUT_RS_QUIRKS_CHECK_DIR: ${{ runner.temp }}/libinput-upstream/quirks
        run: >-
          cargo test --locked --lib
          quirks::tests::quirk_database_fields_have_runtime_semantics -- --exact

      - name: Run compositor-facing upstream suite
        env:
          LIBINPUT_RS_ALLOW_UINPUT_TESTS: "1"
          LIBINPUT_RS_PARITY_REPORT: ${{ runner.temp }}/libinput-rs-parity.toml
          LIBINPUT_RS_RAW_REPORT: ${{ runner.temp }}/libinput-rs-upstream-suite.yaml
          LIBINPUT_RS_SUITE_QUIET: "1"
          LIBINPUT_RS_SUITE_JOBS: "4"
        run: |
          sudo modprobe uinput
          test -c /dev/uinput
          scripts/run-upstream-public-abi-suite.sh \
            "$RUNNER_TEMP/libinput-upstream" \
            "$RUNNER_TEMP/libinput-upstream-build"

      - name: Upload test-derived parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libinput-rs-parity
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/libinput-rs-parity.toml
            ${{ runner.temp }}/libinput-rs-upstream-suite.yaml

  rpm-lint:
    name: RPM lint
    needs: rust-rpm
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install rpmlint
        run: dnf -y -q install rpmlint >/dev/null 2>&1

      - name: Download binary RPMs
        uses: actions/download-artifact@v4
        with:
          name: libinput-rs-rpms
          path: rpm

      - name: Lint RPMs
        shell: bash
        run: |
          set -o pipefail
          rpmlint -r packaging/rpmlintrc rpm/*.rpm 2>&1 | tee rpmlint.txt

      - name: Upload RPM lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpmlint-report
          path: rpmlint.txt

  proofs:
    name: Safety proofs
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install proof compilers
        run: dnf -y -q install Agda idris2 gcc-gfortran make

      - name: Check Agda, Idris, and Fortran models
        run: make proofs-strict
