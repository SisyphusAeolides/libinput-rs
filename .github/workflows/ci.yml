name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-rpm:
    name: Rust and RPM
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DNF dependencies
        run: >-
          dnf -y -q install Agda idris2 cpio elfutils gcc gcc-gfortran libwacom-devel make
          pkgconf-pkg-config ripgrep rust cargo clippy rustfmt binutils rpm-build rpmdevtools
          systemd-devel systemd-rpm-macros

      - name: Check packaging inputs
        run: make packaging-check

      - name: Check Rust workspace
        run: cargo check --locked --workspace

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test restricted discovery
        run: cargo test --locked --package libinput-rs-evdev

      - name: Test libinput implementation
        run: cargo test --locked --package libinput-rs

      - name: Check safety models
        run: make proofs-strict

      - name: Build shared library
        run: make shared

      - name: Compare ABI against system libinput when available
        run: |
          if test -r /usr/lib64/libinput.so.10; then
            make abi-check REFERENCE_LIBINPUT=/usr/lib64/libinput.so.10
          else
            echo "System libinput reference is unavailable; skipping ABI comparison."
          fi

      - name: Check source packaging
        run: make crate-package-check

      - name: Verify ABI isolation
        run: |
          test "$(readelf -d target/release/libinput.so | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')" = "libinput.so.10"
          objdump -T target/release/libinput.so | grep -q 'LIBINPUT_0.12.0.*libinput_get_fd'
          test -z "$(nm -D target/release/libinput.so | grep -E ' T (rust_|__rd)' || true)"

      - name: Build source RPM
        run: |
          rpm_topdir="$RUNNER_TEMP/libinput-rs-rpmbuild"
          rm -rf "$rpm_topdir"
          mkdir -p "$rpm_topdir/SOURCES" "$rpm_topdir/SRPMS" "$rpm_topdir/RPMS"
          echo "RPM_TOPDIR=$rpm_topdir" >> "$GITHUB_ENV"
          package_name=$(rpmspec -q --srpm --qf '%{NAME}' libinput-rs.spec)
          package_version=$(rpmspec -q --srpm --qf '%{VERSION}' libinput-rs.spec)
          tar --exclude='./target' --exclude='./rpmbuild' --exclude='./rpmbuild2' \
            --exclude='./proofs/fortran/build' --exclude='./.git' \
            --transform="s|^\./|$package_name-$package_version/|" \
            -czf "$rpm_topdir/SOURCES/$package_name-$package_version.tar.gz" .
          rpmbuild -bs libinput-rs.spec --define "_topdir $rpm_topdir"

      - name: Rebuild binary RPM
        run: rpmbuild --rebuild "$RPM_TOPDIR"/SRPMS/*.src.rpm --define "_topdir $RPM_TOPDIR"

      - name: Locate binary RPM
        run: |
          package=$(find "$RPM_TOPDIR/RPMS" -name 'libinput-rs-[0-9]*.rpm' -print -quit)
          test -n "$package"
          echo "RPM_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Inspect RPM metadata
        run: |
          rpm -qpl "$RPM_PACKAGE"
          rpm -qp --provides "$RPM_PACKAGE"
          rpm -qp --obsoletes "$RPM_PACKAGE"

      - name: Upload binary RPM
        uses: actions/upload-artifact@v4
        with:
          name: libinput-rs-rpm
          path: ${{ env.RPM_PACKAGE }}

      - name: Verify RPM payload
        run: make rpm-check RPM_PACKAGE="$RPM_PACKAGE"

  rpm-lint:
    name: RPM lint
    needs: rust-rpm
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install rpmlint
        run: dnf -y -q install rpmlint >/dev/null 2>&1

      - name: Download binary RPM
        uses: actions/download-artifact@v4
        with:
          name: libinput-rs-rpm
          path: rpm

      - name: Lint RPM
        shell: bash
        run: |
          set -o pipefail
          rpmlint rpm/*.rpm 2>&1 | tee rpmlint.txt

      - name: Upload RPM lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpmlint-report
          path: rpmlint.txt

  proofs:
    name: Safety proofs
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install proof compilers
        run: dnf -y -q install Agda idris2 gcc-gfortran make

      - name: Check Agda, Idris, and Fortran models
        run: make proofs-strict
