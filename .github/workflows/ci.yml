name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-rpm:
    name: Rust and RPM
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install DNF dependencies
        run: >-
          dnf -y install rust cargo clippy rustfmt gcc make binutils rpm-build
          rpmdevtools rpmlint systemd-rpm-macros

      - name: Check Rust
        run: make check

      - name: Test Rust
        run: make test

      - name: Build artifacts
        run: make all

      - name: Verify ABI isolation
        run: |
          test "$(readelf -d target/release/libinput.so | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')" = "libinput.so.10"
          objdump -T target/release/libinput.so | grep -q 'LIBINPUT_0.12.0.*libinput_get_fd'
          test -z "$(nm -D target/release/libinput.so | grep -E ' T (rust_|__rd)' || true)"

      - name: Build and inspect RPMs
        run: |
          mkdir -p "$PWD/rpmbuild/SOURCES" "$PWD/rpmbuild/SRPMS" "$PWD/rpmbuild/RPMS"
          git archive --format=tar.gz --prefix=libinput-rs-0.2.0/ --output="$PWD/rpmbuild/SOURCES/libinput-rs-0.2.0.tar.gz" HEAD
          rpmbuild -bs libinput-rs.spec --define "_topdir $PWD/rpmbuild"
          rpmbuild --rebuild "$PWD"/rpmbuild/SRPMS/*.src.rpm --define "_topdir $PWD/rpmbuild"
          package=$(find "$PWD/rpmbuild/RPMS" -name 'libinput-rs-[0-9]*.rpm' -print -quit)
          test -n "$package"
          rpm -qp --provides "$package" | grep -q '^libinput-rs = '
          ! rpm -qp --provides "$package" | grep -q 'libinput\.so\.10'
          rpm -qpl "$package" | grep -q '/libinput-rs/libinput\.so\.10$'
          ! rpm -qpl "$package" | grep -q '/libinput\.so\.10$'
          rpm -qp --requires "$package" | grep -q '/libinput\.so\.10$'
          rpmlint "$package"

  proofs:
    name: Safety proofs
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install proof compilers and Austral DNF dependencies
        run: >-
          dnf -y install Agda idris2 git make gcc python3 ocaml ocaml-findlib
          ocaml-dune ocaml-ppxlib-devel ocaml-ppx-deriving-devel
          ocaml-ppx-sexp-conv-devel ocaml-sexplib-devel ocaml-ounit-devel
          ocaml-menhir ocaml-zarith-devel ocaml-yojson-devel

      - name: Build Austral from official source
        run: |
          git clone https://github.com/austral/austral.git target/austral
          git -C target/austral checkout 0962d2a8a5d77f7daacd7f696819520733f4897d
          make -C target/austral -j2

      - name: Check Agda, Idris, and Austral models
        run: make proofs-strict AUSTRAL="$PWD/target/austral/austral"
