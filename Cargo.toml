[package]
name = "libinput-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Fail-open Rust touchpad companion and experimental libinput ABI implementation"
license = "MIT"
repository = "https://github.com/SisyphusAeolides/libinput-rs"
readme = "README.md"

[[bin]]
name = "libinput-rs"
path = "src/main.rs"

[lib]
name = "input"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
evdev = "0.13"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
nix = { version = "0.29", features = ["ioctl", "fs", "inotify"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
